[package]
name = "shellgame"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Interactive terminal learning experience for filesystem navigation"
license = "GPL-3.0-only"
authors = ["Jakub Dupak <dev@jakubdupak.com>"]
publish = false

# The end-to-end suite generates one named trial per level and shell (libtest-mimic), so it brings
# its own harness.
[[test]]
name = "e2e"
harness = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process", "termios", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
unicode-width = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
libtest-mimic = "0.8.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
