[package]
name = "shellgame"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Interactive terminal learning experience for filesystem navigation"
license = "GPL-3.0-only"
authors = ["Jakub Dupak <dev@jakubdupak.com>"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "shellgame"
path = "src/main.rs"

# The end-to-end suites generate one named trial per level and shell (libtest-mimic), so they
# bring their own harness.
[[test]]
name = "solutions"
path = "tests/solutions.rs"
harness = false

[[test]]
name = "strict_cd"
path = "tests/strict_cd.rs"
harness = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "termios", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
libtest-mimic = "0.8.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
